name: Build 3DS CIA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install devkitPro via pacman (official)
      run: |
        sudo apt update
        sudo apt install -y wget tar xz-utils

        wget https://apt.devkitpro.org/install-devkitpro-pacman
        chmod +x install-devkitpro-pacman
        sudo ./install-devkitpro-pacman

        sudo dkp-pacman -Syu --noconfirm
        sudo dkp-pacman -S --noconfirm devkitARM 3ds-dev 3ds-tools

    - name: Build CIA
      run: |
        export DEVKITPRO=/opt/devkitpro
        export DEVKITARM=/opt/devkitpro/devkitARM
        make

    - name: Upload CIA artifact
      uses: actions/upload-artifact@v4
      with:
        name: MM3DRandoManager-CIA
        path: MM3DRandoManager.cia
