name: Build 3DS CIA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install devkitPro (official method)
      run: |
        sudo apt update
        sudo apt install -y ca-certificates gnupg curl
        curl -fsSL https://apt.devkitpro.org/devkitpro.gpg | sudo gpg --dearmor -o /usr/share/keyrings/devkitpro.gpg
        echo "deb [signed-by=/usr/share/keyrings/devkitpro.gpg] https://apt.devkitpro.org stable main" | sudo tee /etc/apt/sources.list.d/devkitpro.list
        sudo apt update
        sudo apt install -y devkitARM 3ds-dev 3ds-tools

    - name: Build CIA
      run: |
        export DEVKITPRO=/opt/devkitpro
        export DEVKITARM=/opt/devkitpro/devkitARM
        make

    - name: Upload CIA artifact
      uses: actions/upload-artifact@v4
      with:
        name: MM3DRandoManager-CIA
        path: MM3DRandoManager.cia
